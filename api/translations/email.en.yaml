subject:
    verification: 'Email verification'
    password_reset: 'Password reset'
    restore_account: 'Account restoration'
    resend_2fa: 'Authentication code (Resend)'
error:
    rate_limit: 'You can resend the email only after 1 minute.'
response:
    verification:
        invalid_data: 'Invalid request data.'
        invalid_token: 'Invalid or expired verification token.'
        invalid_type: 'Invalid token type.'
        user_not_found: 'User not found.'
        already_verified: 'Email has already been verified.'
        success: 'Email successfully verified!'
template:
    verification:
        title: 'Registration Confirmation'
        body: 'Thank you for registering! To activate your account, please verify your email address by clicking the button below.'
        button: 'Verify Email'
        footer: 'This link is valid for 1 hour. If you did not register on this site, simply ignore this email.'
    password_reset:
        title: 'Password Reset'
        greeting: 'Hello!'
        body: 'We received a request to reset the password for your account.'
        action: 'To create a new password, please click the button below:'
        button: 'Reset Password'
        footer: 'The recovery link is valid for 1 hour.'
        ignore: 'If you did not make this request, just ignore this email. Your password will remain unchanged.'
        regards: "Best regards,<br>Avante Team"
    restore_account:
        title: 'Account Restoration'
        greeting: 'Hello!'
        body: 'We received a request to restore your deleted account.'
        action: 'To cancel the deletion and regain access to your account, please click the button below:'
        button: 'Restore Account'
        footer: 'The recovery link is valid for 1 hour.'
        ignore: 'If you did not make this request, just ignore this email. Your account will remain deleted.'
        regards: "Best regards,<br>Avante Team"
    resend_2fa:
        title: 'Authentication Code'
        body: 'Here is your verification code to log in to your account. Please enter it on the website:'
        footer: 'This code is valid for 10 minutes. If you did not request this code, simply ignore this email.'
