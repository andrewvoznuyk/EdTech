services:

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: ${PROJECT_NAME}-api
    volumes:
      - ./api:/var/www/api
      # - /var/www/api/var
      # - vendor_data:/var/www/api/vendor
      - public_bundles:/var/www/api/public/bundles
    environment:
      APP_ENV: ${APP_ENV}
      SERVER_NAME: ":80"
      # Worker mode is for production. In dev, classic mode reloads code/routes immediately:
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - ${PROJECT_NAME}

  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: ${PROJECT_NAME}-messenger-worker
    restart: unless-stopped
    stop_grace_period: 30s
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    volumes:
      - ./api:/var/www/api
    environment:
      APP_ENV: ${APP_ENV}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - ${PROJECT_NAME}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${PROJECT_NAME}-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ${PROJECT_NAME}

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile

    command: npm run dev
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    container_name: ${PROJECT_NAME}-frontend
    volumes:
      - ${FRONTEND_DIRECTORY}:/var/www/project/frontend
      - /var/www/project/frontend/node_modules
    networks:
      - ${PROJECT_NAME}

  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-mysql
    restart: unless-stopped
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - ${PROJECT_NAME}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${PROJECT_NAME}-phpmyadmin
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    networks:
      - ${PROJECT_NAME}

  nginx:
    build: ./docker/nginx
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "15671:15671"
    volumes:
      - ${API_DIRECTORY}:/var/www/project/api
      - ${FRONTEND_DIRECTORY}:/var/www/project/frontend
      - ./docker/certs/local:/etc/nginx/certs
      - public_bundles:/var/www/project/api/public/bundles
    networks:
      - ${PROJECT_NAME}
    environment:
      NODE_ENV: dev
      NGINX_HOST: ${NGINX_HOST_LOCAL}
      NGINX_PORT: ${NGINX_PORT_LOCAL}
      NGINX_CERT_CRT: ${NGINX_CERT_CRT_LOCAL}
      NGINX_CERT_KEY: ${NGINX_CERT_KEY_LOCAL}
      NGINX_CONF_TYPE: ${NGINX_CONF_TYPE}

networks:
  project:

volumes:
  mysql:
  vendor_data:
  public_bundles:
  rabbitmq_data: